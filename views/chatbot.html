  <!-- JAVASCRIPT DO CHAT CORRIGIDO -->
  <script>
      document.addEventListener("DOMContentLoaded", () => {
          const chatForm = document.getElementById("chat-form");
          const chatWindow = document.getElementById("chat-window");
          const userInput = document.getElementById("user-input");

          // Respostas expandidas do bot (O "cérebro" da Top Carga)
          const responses = {
            "olá": "Olá! Sou o assistente CargaTop. Como posso ajudar você a encontrar o carregador ideal para o seu aparelho hoje? 🔋",
            "oi": "Oi! Tudo bem? Fale sobre o tipo de carregador ou acessório que você procura.",
            "serviços": "A CargaTop é especializada em **venda de carregadores de alta qualidade** e acessórios compatíveis. Trabalhamos apenas com produtos certificados e duráveis.",
            "carregador": "Temos carregadores para todos os modelos: USB-C, Lightning, Micro USB, e modelos por indução. Você está buscando algum modelo específico, de alta potência (turbo) ou um cabo?",
            "turbo": "Sim, temos uma linha completa de carregadores turbo e de carregamento rápido. Eles garantem a carga mais eficiente e segura para o seu dispositivo.",
            "cabo": "Temos cabos reforçados e de diversos tamanhos, compatíveis com todas as marcas. Qual tipo de entrada você precisa (USB-C, Lightning, Micro USB)?",
            "quem são vocês": "Somos a Top Carga, a loja especializada em carregadores e acessórios com foco em qualidade, certificação e durabilidade.",
            "loja": "Nossa loja física está localizada em [INSERIR ENDEREÇO AQUI]. Também vendemos online com entrega rápida para todo o Brasil!",
            "endereço": "Nossa loja está em [Senac SP]. Venha nos visitar de segunda a sexta, das 8h às 18h.",
            "garantia": "Sim, todos os nossos carregadores e acessórios têm garantia. A duração exata depende do item, mas garantimos a qualidade e troca em caso de defeito de fabricação.",
            "prazo": "Para compras em nossa loja física, o carregador é imediato. Para compras online, o envio é feito em até 24h úteis.",
            "contato": "Você pode nos ligar no [1199999999] ou enviar um email para contato@topcarga.com.br. Estamos prontos para te atender!",
            "whatsapp": "Nosso WhatsApp é o [188888888]. Você pode clicar aqui para falar conosco: [www.whatssapp.com.br]",
            "obrigado": "De nada! Estou aqui se precisar de algo mais sobre carregadores e acessórios.",
            "tchau": "Até mais! Agradecemos o contato com a CargaTop. Volte sempre!"
          };

          chatForm.addEventListener("submit", (e) => {
              e.preventDefault(); 
              const userMessage = userInput.value.trim();
              if (userMessage) {
                  addMessage(userMessage, "user-message");
                  respondToUser(userMessage);
                  userInput.value = ""; 
              }
          });

          function addMessage(text, className) {
              const messageDiv = document.createElement("div");
              messageDiv.textContent = text;
              messageDiv.classList.add("message", className);
              chatWindow.appendChild(messageDiv);
              chatWindow.scrollTop = chatWindow.scrollHeight; 
          }

          function respondToUser(userMessage) {
              // Lógica de resposta baseada em palavras-chave
              const lowerCaseMessage = userMessage.toLowerCase();
              let botResponse = "Desculpe, não consegui encontrar uma resposta direta. Tente perguntar sobre **carregadores**, **manutenção** ou o **endereço** da loja.";

              // Itera sobre as respostas buscando a palavra-chave
              for (const keyword in responses) {
                  // Checa se a mensagem do usuário inclui a palavra-chave
                  if (lowerCaseMessage.includes(keyword)) {
                      botResponse = responses[keyword];
                      break;
                  }
              }

              // Simula um pequeno atraso para parecer mais natural
              setTimeout(() => {
                  addMessage(botResponse, "bot-message");
              }, 500);
          }
      });
  </script>
</body>
</html>
